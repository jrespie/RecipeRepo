services:
  postgres:
    image: postgres:16-alpine
    container_name: recipe-repo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: recipe_repo
      POSTGRES_USER: recipe_user
      POSTGRES_PASSWORD: recipe_password
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
